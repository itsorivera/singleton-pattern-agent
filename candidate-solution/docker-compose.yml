services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp-server
    container_name: geoai-mcp-server
    environment:
      LOCATION_SERVICE_URL: http://location-service:8001
      MCP_SERVER_PORT: "8003"
    ports:
      - "8003:8003"
    networks:
      - gen-ai-network

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: geoai-analyzer-agent
    environment:
      MCP_SERVER_URL: http://mcp-server:8003/sse
      LOCATION_SERVICE_URL: http://location-service:8001
      DATABASE_URL: postgresql://agent_user:agent_password@postgres:5432/gen_ai_agent_db
      AGENT_PORT: "8000"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
    ports:
      - "8000:8000"
    depends_on:
      - mcp-server
    networks:
      - gen-ai-network

networks:
  gen-ai-network:
    name: singleton-pattern-agent_gen-ai-network
    external: true