[project]
name = "geoai-agent"
version = "0.1.0"
description = "Analyzer agent (FastAPI + LangChain) that consumes MCP tools and persists to PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langchain>=0.2.0",
    "langchain-aws>=0.1.3",
    "mcp>=1.2.0,<2",
    "httpx>=0.25.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
package = true