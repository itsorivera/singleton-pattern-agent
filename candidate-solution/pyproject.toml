[project]
name = "geoai-candidate-solution"
version = "0.1.0"
description = "Candidate solution: MCP server + analyzer agent for GeoAI Analytics"
requires-python = ">=3.10"
dependencies = [
    "mcp-server",
    "geoai-agent",
]

[tool.uv.sources]
mcp-server = { workspace = true }
geoai-agent = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp_server", "agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"